<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recognition Nudge — Slack prototype</title>

       type matches; if the machine is offline the stack below it takes over and
       nothing else changes. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>

  <div class="sk-app">

    <!-- Slack's global top bar: history controls left, search centre, help right. -->
    <header class="sk-topbar">
      <div class="sk-topbar-side">
        <button class="sk-top-icon" type="button" aria-label="Back" disabled><svg><use href="#i-back"/></svg></button>
        <button class="sk-top-icon" type="button" aria-label="Forward" disabled><svg><use href="#i-fwd"/></svg></button>
        <button class="sk-top-icon" type="button" aria-label="History"><svg><use href="#i-clock"/></svg></button>
      </div>
      <button class="sk-topbar-search" type="button" id="searchBtn">
        <svg class="sk-topbar-search-icon"><use href="#i-search"/></svg>
        <span id="searchLabel">Search</span>
      </button>
      <div class="sk-topbar-side sk-topbar-side-right">
        <button class="sk-top-icon" type="button" aria-label="Help"><svg><use href="#i-help"/></svg></button>
      </div>
    </header>

    <div class="sk-body">

      <nav class="sk-rail" aria-label="Workspaces">
        <button class="sk-rail-ws" type="button" id="wsBtn" aria-label="Northwind Collective workspace">N</button>
        <div class="sk-rail-nav">
          <button class="sk-rail-btn is-active" type="button" aria-label="Home">
            <span class="sk-rail-glyph"><svg><use href="#i-home"/></svg></span><span class="sk-rail-label">Home</span>
          </button>
          <button class="sk-rail-btn" type="button" aria-label="Direct messages">
            <span class="sk-rail-glyph"><svg><use href="#i-dm"/></svg></span><span class="sk-rail-label">DMs</span>
          </button>
          <button class="sk-rail-btn" type="button" aria-label="Activity">
            <span class="sk-rail-glyph"><svg><use href="#i-bell"/></svg></span><span class="sk-rail-label">Activity</span>
          </button>
          <button class="sk-rail-btn" type="button" aria-label="Later">
            <span class="sk-rail-glyph"><svg><use href="#i-later"/></svg></span><span class="sk-rail-label">Later</span>
          </button>
          <button class="sk-rail-btn" type="button" aria-label="More">
            <span class="sk-rail-glyph"><svg><use href="#i-more"/></svg></span><span class="sk-rail-label">More</span>
          </button>
        </div>
        <div class="sk-rail-foot" id="railUser"></div>
      </nav>

      <aside class="sk-sidebar" id="sidebar" aria-label="Channels"></aside>

      <main class="sk-main">
        <header class="sk-chan-header" id="chanHeader"></header>
        <div class="sk-messages" id="messages" role="log" aria-label="Messages" aria-live="polite"></div>

        <div class="sk-composer">
          <div class="sk-composer-box">
            <div class="sk-composer-format" role="toolbar" aria-label="Formatting">
              <button class="sk-fmt" type="button" aria-label="Bold"><svg><use href="#i-bold"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Italic"><svg><use href="#i-italic"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Strikethrough"><svg><use href="#i-strike"/></svg></button>
              <span class="sk-fmt-sep"></span>
              <button class="sk-fmt" type="button" aria-label="Link"><svg><use href="#i-link"/></svg></button>
              <span class="sk-fmt-sep"></span>
              <button class="sk-fmt" type="button" aria-label="Ordered list"><svg><use href="#i-ol"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Bulleted list"><svg><use href="#i-ul"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Blockquote"><svg><use href="#i-quote"/></svg></button>
              <span class="sk-fmt-sep"></span>
              <button class="sk-fmt" type="button" aria-label="Code"><svg><use href="#i-code"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Code block"><svg><use href="#i-codeblock"/></svg></button>
            </div>

            <textarea class="sk-composer-input" id="composerInput" rows="1"
                      aria-label="Message input" placeholder="Message"></textarea>

            <div class="sk-composer-actions">
              <button class="sk-fmt" type="button" aria-label="Attach"><svg><use href="#i-plus"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Emoji"><svg><use href="#i-emoji"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Mention someone"><svg><use href="#i-at"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Record video clip"><svg><use href="#i-video"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Record audio clip"><svg><use href="#i-mic"/></svg></button>
              <button class="sk-fmt" type="button" aria-label="Shortcuts"><svg><use href="#i-slash"/></svg></button>
              <!-- Never `disabled`: Slack greys the button out when the box is
                   empty but keeps it clickable, and send() already no-ops. -->
              <button class="sk-send" type="button" id="sendBtn" aria-label="Send message">
                <svg><use href="#i-send"/></svg>
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- Slack's split view: a right-hand pane with its own header and ✕. -->
      <aside class="sk-trace" aria-label="Agent trace">
        <div class="sk-trace-head">
          <div class="sk-trace-heading">
            <div class="sk-trace-title">Agent trace</div>
            <div class="sk-trace-sub">input &rarr; reads &rarr; decision &rarr; drafted fields &rarr; human</div>
          </div>
          <button class="sk-trace-x" type="button" aria-label="Close panel" title="Panel stays open in the demo">
            <svg><use href="#i-x"/></svg>
          </button>
        </div>
        <div id="traceBody"></div>
      </aside>

    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="data.js"></script>
  <!-- Prompts build from DATA, so they load after it. llm.js reads the prompts,
       evals.js reads llm.js's verdict cache. -->
  <script src="prompts/_shared.js"></script>
  <script src="prompts/listener.js"></script>
  <script src="prompts/drafter.js"></script>
  <script src="prompts/policy-judge.js"></script>
  <script src="llm.js"></script>
  <script src="evals.js"></script>
  <script src="agents.js"></script>
  <script src="ui.js"></script>
</body>
</html>
