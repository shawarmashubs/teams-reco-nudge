<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teams-ish Chat Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- App rail: switches between Chats and Teams -->
    <nav class="app-rail">
      <button class="rail-item" id="railChats" data-view="chats">
        <span class="rail-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 5.5C3 4.11929 4.11929 3 5.5 3H14.5C15.8807 3 17 4.11929 17 5.5V11.5C17 12.8807 15.8807 14 14.5 14H8.5L5 17V14H5.5C4.11929 14 3 12.8807 3 11.5V5.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </span>
        <span class="rail-label">Chat</span>
      </button>
      <button class="rail-item" id="railTeams" data-view="teams">
        <span class="rail-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><circle cx="14" cy="7.5" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M2 16C2 12.9624 4.46243 10.5 7.5 10.5C9.51414 10.5 11.2749 11.5885 12.2207 13.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12 15.6C12 13.5013 13.9998 11.8 16.4642 11.8C16.9909 11.8 17.4966 11.8804 17.9677 12.0288" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>
        <span class="rail-label">Teams</span>
      </button>
      <button class="rail-item rail-item-disabled" title="Not available in this prototype">
        <span class="rail-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4.5" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 8H17" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 3V5.5M13.5 3V5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span class="rail-label">Calendar</span>
      </button>
      <button class="rail-item rail-item-disabled" title="Not available in this prototype">
        <span class="rail-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6C3 5.17157 3.67157 4.5 4.5 4.5H7.6459C8.02986 4.5 8.39818 4.65451 8.66789 4.92851L9.5 5.77149C9.76971 6.04549 10.138 6.2 10.522 6.2H15.5C16.3284 6.2 17 6.87157 17 7.7V13.5C17 14.3284 16.3284 15 15.5 15H4.5C3.67157 15 3 14.3284 3 13.5V6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </span>
        <span class="rail-label">Files</span>
      </button>
    </nav>

    <!-- List panel: Chats list OR Teams/Channels tree -->
    <aside class="list-panel">
      <div class="list-panel-header">
        <button id="userSwitcherBtn" class="user-avatar-btn"></button>
        <div id="userMenu" class="user-menu hidden"></div>
        <h1 id="listPanelTitle" class="list-panel-title">Chat</h1>
        <button id="evalConsoleBtn" class="icon-btn" title="Eval Console — run the Listener's test suite">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 2.5H10M6.8 2.5V5.6L3.6 11.2C3.2 11.9 3.7 12.8 4.5 12.8H11.5C12.3 12.8 12.8 11.9 12.4 11.2L9.2 5.6V2.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
        <button id="newChatBtn" class="icon-btn" title="New chat">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 2.5V13.5M2.5 8H13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="list-panel-search">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.4"/><path d="M13 13L10.3 10.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search" autocomplete="off" />
      </div>

      <div class="list-view" id="chatsListView"></div>
      <div class="list-view hidden" id="teamsListView"></div>
    </aside>

    <!-- Main conversation area -->
    <main class="chat-area">
      <header class="chat-header">
        <div id="conversationAvatarGroup" class="conversation-avatar-group"></div>
        <div class="chat-header-text">
          <h2 id="conversationTitle"></h2>
          <span id="conversationSubtitle" class="conversation-subtitle"></span>
        </div>
      </header>

      <div class="chat-tabs" id="chatTabs">
        <span class="chat-tab active">Posts</span>
        <span class="chat-tab chat-tab-disabled" title="Not available in this prototype">Files</span>
      </div>

      <div class="message-list" id="messageList"></div>

      <form class="message-input-bar" id="messageForm">
        <input
          type="text"
          id="messageInput"
          placeholder="Type a new message"
          autocomplete="off"
        />
        <button type="submit" id="sendBtn">Send</button>
      </form>
    </main>
  </div>

  <!-- Eval Console modal -->
  <div class="modal-overlay hidden" id="evalConsoleModal">
    <div class="modal eval-modal">
      <div class="eval-modal-header">
        <h3>Eval Console</h3>
        <button type="button" class="icon-btn" id="closeEvalConsole" title="Close">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 3L13 13M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="modal-hint">
        Runs the Listener's classifier against the labeled test set (Eval 0) plus the 10 scenario cases from the PRD's Design &gt; Evaluation section — live, against this running prototype.
      </p>
      <button type="button" class="btn-primary" id="runEvalSuiteBtn">Run eval suite</button>
      <div id="evalResults" class="eval-results"></div>
    </div>
  </div>

  <!-- New chat modal -->
  <div class="modal-overlay hidden" id="newChatModal">
    <div class="modal">
      <h3>New chat</h3>
      <p class="modal-hint">Select one person for a 1:1 chat, or several for a group chat.</p>
      <div class="participant-picker" id="participantPicker"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelNewChat">Cancel</button>
        <button type="button" class="btn-primary" id="startNewChat">Start chat</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
